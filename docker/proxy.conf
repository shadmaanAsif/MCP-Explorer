# Stage 11.4: the smallest proxy that works for MCP over HTTP.
# Round-robin between two instances. The two settings that matter are
# `proxy_buffering off` (without it nginx holds SSE events back until a buffer
# fills, so progress messages arrive late or all at once) and a long
# `proxy_read_timeout` (a stream may be quiet for a while).
# TLS, auth and routing rules are Stage 13's gateway work, not here.

upstream mcp_servers {
    server server-a:4768 max_fails=1 fail_timeout=5s;
    server server-b:4768 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://mcp_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # A dead instance refuses or times out quickly, then the next one is tried.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
    }
}
