# Stage 11.4: Redis, a token issuer, two server instances and a proxy in front of them.
#
#   docker compose -f docker/compose.scale.yml up -d
#   node docker/kill-test.mjs
#   docker compose -f docker/compose.scale.yml down
#
# The server and issuer run the compiled code from this repo (bind-mounted), so
# run `pnpm build` first. There is no Dockerfile on purpose: packaging the
# server for production is Stage 13.
#
# Auth is on. The issuer is its own service because the servers only know it by
# URL: they fetch its public key (/jwks.json) and check each token's signature,
# so any instance accepts a token without sharing anything with the others.
# Redis and the issuer are not published to the host, so they cannot clash with
# a Redis on 6379 or an issuer on 4769 that you already run.

x-server: &server
  image: node:24.22.2-alpine
  working_dir: /app
  volumes:
    - ..:/app:ro
  command: node packages/server/build/http.js
  environment:
    MCP_SERVER_PORT: "4768"
    # The address clients use (the proxy), and so the audience tokens must carry.
    MCP_SERVER_URL: http://localhost:4790/mcp
    MCP_MODE: stateful
    SESSION_STORE: redis
    REDIS_URL: redis://redis:6379
    RESUMABLE_STREAMS: "1"
    AUTH_REQUIRED: "1"
    ISSUER_URL: http://issuer:4769
  depends_on:
    redis:
      condition: service_healthy
    issuer:
      condition: service_healthy

services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  issuer:
    image: node:24.22.2-alpine
    working_dir: /app
    volumes:
      - ..:/app:ro
      # The repo mount is read-only, so the signing key lives in a named volume.
      - issuer-keys:/keys
    command: node packages/server/build/auth/issuer-cli.js serve
    environment:
      ISSUER_PORT: "4769"
      ISSUER_URL: http://issuer:4769
      ISSUER_KEY_FILE: /keys/issuer-key.json
      TOKEN_AUDIENCE: http://localhost:4790/mcp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4769/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  server-a:
    <<: *server

  server-b:
    <<: *server

  proxy:
    image: nginx:alpine
    ports:
      - "4790:80"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server-a
      - server-b

volumes:
  issuer-keys:
